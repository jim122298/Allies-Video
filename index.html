<!DOCTYPE html>

<meta charset="UTF-8">

<style>
body{
  margin:0;
  font-family:Segoe UI, Arial, sans-serif;
  background:transparent;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:24px;
}

.filters button{
  border:2px solid #094876;
  background:transparent;
  color:#094876;
  padding:8px 15px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}

.filters button.active,
.filters button:hover{
  background:#094876;
  color:white;
}

.library{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:26px;
}

.video{
  text-decoration:none;
  color:#094876;
  transition:.25s ease;
}

.video:hover{
  transform:translateY(-6px);
}

.poster{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  border:3px solid #094876;
  box-shadow:0 18px 35px rgba(0,0,0,.18);
  background:transparent;
}

.poster img{
  width:100%;
  display:block;
  transition:.35s ease;
}

.video:hover img{
  transform:scale(1.045);
}

.year{
  position:absolute;
  top:14px;
  left:14px;
  background:#F19F01;
  color:white;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.type{
  position:absolute;
  bottom:14px;
  right:14px;
  background:#52348D;
  color:white;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.info{
  padding:13px 6px 4px;
}

.title{
  font-size:20px;
  font-weight:800;
  color:#094876;
  margin-bottom:5px;
}

.date{
  color:#D75318;
  font-weight:700;
  font-size:14px;
}
</style>
</head>

const library = document.getElementById("library");
const filters = document.getElementById("filters");

const years = ["All", ...new Set(videos.map(v => v.year).sort())];

years.forEach(year => {
  const btn = document.createElement("button");
  btn.textContent = year;
  btn.dataset.year = year;

  if(year === "All") btn.classList.add("active");

  btn.onclick = () => {
    document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render(year);
  };

  filters.appendChild(btn);
});

function render(selectedYear = "All"){
  library.innerHTML = "";

  videos
    .filter(v => selectedYear === "All" || v.year === selectedYear)
    .sort((a,b) => Number(a.year) - Number(b.year))
    .forEach(item => {
      const card = document.createElement("a");
      card.className = "video";
      card.href = item.video;
      card.target = "_blank";
      card.rel = "noopener noreferrer";

      card.innerHTML = `
        <div class="poster">
          <img src="${item.image}" alt="">
          <div class="year">${item.year}</div>
          <div class="type">VIDEO</div>
        </div>
        <div class="info">
          <div class="title">${item.title}</div>
          <div class="date">${item.date}</div>
        </div>
      `;

      library.appendChild(card);
    });
}

render();
